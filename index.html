function esc(text){
return String(text).replace(/[&<>"']/g,function(m){
return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m];
});
}

function setAddress(url){
address.textContent=url;
}

function link(site,text){
return '<a data-site="'+site+'">'+text+'</a>';
}

function go(site,push=true){

if(push){

historyStack.splice(historyPos+1);

historyStack.push(site);

historyPos++;
}

setAddress(
sites[site] ?
sites[site].url :
site
);

if(routes[site]){
routes[site]();
}else{
show404(site);
}

saveGame();
}

document.addEventListener("click",function(e){

const a=e.target.closest("[data-site]");

if(a){

e.preventDefault();

go(a.dataset.site);

}

});

document.getElementById("back").onclick=function(){

if(historyPos>0){

historyPos--;

go(historyStack[historyPos],false);

}

};

document.getElementById("forward").onclick=function(){

if(historyPos<historyStack.length-1){

historyPos++;

go(historyStack[historyPos],false);

}

};

document.getElementById("home").onclick=function(){

go("searchly");

};

document.getElementById("enterWeb").onclick=function(){

document.getElementById("startOverlay").style.display="none";

go("searchly");

};

function layout(title,body,extra=""){

page.innerHTML=
'<div class="siteHead '+extra+'">'+
'<h1>'+title+'</h1>'+
'<small>WebWorld Internet Service • 2004</small>'+
'</div>'+
'<div class="siteBody">'+body+'</div>';

}

function show404(site){

layout(
"404 - Page Not Found",
'<div class="center">'+
'<h2>Oops!</h2>'+
'<p>The page <b>'+esc(site)+'</b> could not be found.</p>'+
'<p>Maybe the link is broken.</p>'+
link("searchly","Return to Searchly")+
'</div>'
);

}

document.getElementById("searchBtn").onclick=doSearch;

document.getElementById("search").onkeydown=function(e){

if(e.key==="Enter"){
doSearch();
}

};

};

/* SEARCH */

function doSearch(){

const q=document.getElementById("search").value.trim();

if(!q)return;

searches.push(q);

const low=q.toLowerCase();

let results=[];

function add(site,title,text){

results.push(
'<div class="box">'+
'<h3>'+link(site,title)+'</h3>'+
'<p>'+text+'</p>'+
'</div>'
);

}

if(
/cult|sect|group|religion|ritual|church|belief/
.test(low)
){

add(
"cultwatch",
"CultWatch",
"Independent research about unusual religious and social groups."
);

add(
"archive",
"The Cult Archive",
"A searchable archive of historical cult reports."
);

add(
"cultnews",
"CultNews",
"News and investigations concerning modern cults."
);

add(
"exmembers",
"ExMembers",
"Stories from people who say they left controlling groups."
);

}

if(
/open eye|openeye|eye|elys|vale|hollow|garden/
.test(low)
){

add(
"cultwatch",
"The Open Eye — CultWatch entry",
"A small online group mentioned in several old reports."
);

add(
"garden",
"GardenTalk",
"An archived gardening discussion contains a strange reference."
);

}

if(/game|games/.test(low)){

add(
"gamehub",
"GameHub 2004",
"The latest games, cheats and reviews."
);

}

if(/weather/.test(low)){

add(
"weather",
"WeatherWorld",
"Today's weather and tomorrow's forecast."
);

}

if(/fish|fishing/.test(low)){

add(
"gamehub",
"Fishing Mania",
"A relaxing fishing game."
);

}

if(!results.length){

results.push(
'<div class="box">'+
'<h3>No exact results.</h3>'+
'<p>Try a broader search.</p>'+
'</div>'
);

results.push(
'<div class="box">'+
'<h3>'+link("picshare","PicShare")+'</h3>'+
'<p>Pictures from around the web.</p>'+
'</div>'
);

}

layout(
"Search Results",
'<p>Results for <b>'+esc(q)+'</b></p>'+
results.join("")
);

}
