<script>
"use strict";

/* =========================================================
   GAME STATE
========================================================= */

let player={

};

let hist=[];
let pos=-1;
let started=false;

/* =========================================================
   WEBSITE DATABASE
========================================================= */

const sites={

rachel:["Rachel's Dream Journal","racheldreams.net"],
ian:["Ian's Map Collection","ianmaps.net"],
molly:["Molly's Garden","mollygarden.net"],
fred:["Fred's Weird Stuff","fredweird.net"],
claire:["Claire's Photography","clairephoto.net"],
dan:["Dan's Movie Page","danmovies.net"],
laura:["Laura's Doll Collection","lauradolls.net"],
nick:["Nick's Radio Page","nickradio.net"],
olivia:["Olivia's Poetry Page","oliviapoetry.net"],
ben:["Ben's Fishing Page","benfishing.net"],
julia:["Julia's Web Diary","juliaweb.net"],

/* HEALTH / MEDICAL */

health:["HealthyLife","healthylife.net"],
doctor:["Dr. Miller's Medical Page","drmiller-medical.net"],
hospital:["County Medical Center","countymedical.net"],
pharmacy:["Internet Pharmacy Guide","pharmacyguide.net"],
firstaid:["First Aid Corner","firstaidcorner.net"],
mental:["Mind & Wellness","mindwellness.net"],
sleep:["Better Sleep Homepage","bettersleep.net"],
nutrition:["Nutrition Notes","nutritionnotes.net"],
medicalforum:["Medical Forum","medicalforum.net"],

/* CULT RESEARCH */

cult:["CultWatch","cultwatch.net"],
archive:["The Cult Archive","cultarchive.net"],
ex:["ExMembers","exmembers.net"],
cnews:["CultNews","cultnews.net"],
research:["Religion Research","religionresearch.net"],
history:["HistoryNet","historynet.net"],

/* OTHER GROUPS */

lantern:["Lantern Society","lanternsociety.net"],
hollow:["Hollow Creek","hollowcreek.net"],
veyra:["Veyra Circle","veyra.net"],
stars:["Children of the Star","childrenofstar.net"],
mirror:["Mirror House","mirrorhouse.net"],
garden:["GardenTalk","gardentalk.net"],
eye:["The Open Eye","theopeneye.net"],

/* DEEP ARG */

blackbox:["BlackBox Archive","blackbox.net"],
oldforum:["Old Forum Archive","oldforum.net"],
deadpage:["DeadPage","deadpage.net"],
numberseven:["Room 7","room7.net"],
northstar:["North Star Project","northstar.net"],
watcher:["The Watcher","thewatcher.net"],
archive2:["Archive 17","archive17.net"],
map:["The Web Map","webmap.net"],
lostmail:["Lost Mailbox","lostmail.net"],
webmaster:["Webmaster Graveyard","webmastergraveyard.net"],
clock:["The Clock","theclock.net"],
echo:["Echo Page","echo.net"],
door:["The Door","doorway.net"]
};

/* =========================================================
   ROUTES
========================================================= */

const routes={};

function L(id,text){
 return `<a onclick="go('${id}')">${text||sites[id]?.[0]||id}</a>`;
}

function esc(x){
 return String(x).replace(/[&<>"]/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;"
 }[m]));
}

function layout(title,body,cls=""){
 document.getElementById("page").innerHTML=
 `<div class="head ${cls}">
   <h1>${title}</h1>
   <small>WebWorld Internet Service • 2004</small>
  </div>
  <div class="body">${body}</div>`;
}

function go(id,push=true){

 if(!sites[id]){
  notfound();
  return;
 }

 if(push){
  hist.splice(pos+1);
  hist.push(id);
  pos++;
 }

 if(!player.visited.includes(id))
  player.visited.push(id);

 document.getElementById("url").textContent=
 "http://"+sites[id][1]+"/";

 if(routes[id])
  routes[id]();
 else
  personal(id);

 save();
}

function back(){
 if(pos>0){
  pos--;
  go(hist[pos],false);
 }
}

function forward(){
 if(pos<hist.length-1){
  pos++;
  go(hist[pos],false);
 }
}

function notfound(){
 layout("404 - Page Not Found",`
  <div class=center>
   <h2>WHOOPS!</h2>
   <p>This page could not be found.</p>
   <p>Maybe the webmaster deleted it.</p>
   <p><a onclick="go('home')">Return to Searchly</a></p>
  </div>
 `);
}

/* =========================================================
   START SYSTEM
   Several independent ways to start the game are included
   so the button won't randomly stop responding.
========================================================= */

function startGame(){

 if(started)return;

 started=true;

 const start=document.getElementById("start");

 if(start)
  start.style.display="none";

 try{
  load();
 }catch(e){}

 hist=[];
 pos=-1;

 try{
  go("home");
 }catch(e){
  document.getElementById("page").innerHTML=
  `<div class="body">
    <h1>WebWorld</h1>
    <p>The browser encountered an error.</p>
    <button onclick="location.reload()">RELOAD</button>
   </div>`;
 }

 save();
}

/* Backup click handler */
document.addEventListener("click",function(e){
 if(e.target && e.target.id==="startButton"){
  startGame();
 }
});

/* Keyboard backup */
document.addEventListener("keydown",function(e){

 if(!started &&
   (e.key==="Enter" ||
    e.key===" " ||
    e.key==="Spacebar")){
  e.preventDefault();
  startGame();
 }

 if(e.key==="Escape"){
  closeModal();
 }

});

/* Page-load backup */
window.addEventListener("load",function(){

 const b=document.getElementById("startButton");

 if(b){
  b.addEventListener("click",function(){
   startGame();
  });
 }

});

/* =========================================================
   MODAL
========================================================= */

function modal(title,content){
 document.getElementById("mt").textContent=title;
 document.getElementById("mc").innerHTML=content;
 document.getElementById("modal").style.display="flex";
}

function closeModal(){
 document.getElementById("modal").style.display="none";
}

/* =========================================================
   SEARCHLY
========================================================= */

routes.home=function(){

layout("Searchly",`

<div class="center">

<div style="font-size:56px;color:#04c;font-weight:bold">
Searchly!
</div>

<p>SEARCH THE WHOLE WEB*</p>

<div class="search">
<input id="q" placeholder="search the internet">
<button onclick="search()">SEARCH</button>
</div>

<div class="yellow" style="padding:8px;margin:12px">
⭐ TIP: Search for people's names, hobbies, places or strange things.
</div>

</div>

<h3>POPULAR SITES</h3>

<div class="grid">

${[
"pic","tube","game",
"weather","news","forum",
"music","anime","pets",
"health","doctor","guest"
].map(x=>`
<div class="card">
<h3>${L(x)}</h3>
<p>A totally normal website.</p>
</div>`).join("")}

</div>

<h3>RANDOM LINKS</h3>

<div class="grid">

${[
"food","buy","quiz",
"firstaid","sleep","nutrition",
"alex","molly","ben"
].map(x=>`
<div class="card">
${L(x)}
</div>`).join("")}

</div>

<p class="small">
Visitor #
<span class="counter">${Math.floor(Math.random()*9000+1000)}</span>
</p>

`);
};

function search(){

 let q=document.getElementById("q");

 if(!q)return;

 q=q.value.trim();

 if(!q)return;

 let x=q.toLowerCase();
 let r=[];

 const add=(id,title,text)=>{
  r.push(`
  <div class="box">
   <h3>${L(id,title)}</h3>
   <p>${text}</p>
  </div>`);
 };

 if(/cat|pet/.test(x))
  add("pets","Pet Palace","Pictures of pets.");

 if(/fish/.test(x))
  add("ben","Ben's Fishing Page","A personal fishing homepage.");

 if(/space|star|moon|astronomy/.test(x))
  add("nate","Nate's Astronomy Page","Stars, planets and astronomy.");

 if(/horse/.test(x))
  add("sara","Sara's Horse World","Horse pictures and information.");

 if(/poem|poetry/.test(x))
  add("beth","Beth's Poetry Corner","Personal poems.");

 if(/computer|pc/.test(x))
  add("mike","Mike's Computer Page","Computer repairs and hardware.");

 if(/garden|flower|plant/.test(x))
  add("garden","GardenTalk","A gardening forum.");

 if(/movie|film/.test(x))
  add("dan","Dan's Movie Page","Reviews of old movies.");

 if(/book|reading/.test(x))
  add("emily","Emily's Book Nook","Books and reviews.");

 /* HEALTH SEARCHES */

 if(/health|healthy/.test(x))
  add("health","HealthyLife",
  "General health information and wellness articles.");

 if(/doctor|doctor|physician/.test(x))
  add("doctor","Dr. Miller's Medical Page",
  "A fictional doctor's information website.");

 if(/hospital|clinic/.test(x))
  add("hospital","County Medical Center",
  "A fictional local medical center homepage.");

 if(/medicine|medical/.test(x))
  add("doctor","Dr. Miller's Medical Page",
  "Medical information written for the public.");

 if(/sleep|insomnia/.test(x))
  add("sleep","Better Sleep Homepage",
  "General information about sleep.");

 if(/food|nutrition|vitamin/.test(x))
  add("nutrition","Nutrition Notes",
  "Food and nutrition information.");

 if(/first aid|injury|emergency/.test(x))
  add("firstaid","First Aid Corner",
  "Basic fictional educational information.");

 if(/mental|stress|mood/.test(x))
  add("mental","Mind & Wellness",
  "General mental wellness information.");

 if(/pharmacy|pharmac/.test(x))
  add("pharmacy","Internet Pharmacy Guide",
  "A fictional guide explaining how pharmacies work.");

 if(/cult|sect|group|religion|ritual/.test(x)){

  add("cult","CultWatch",
  "Independent research into unusual organizations.");

  add("archive","The Cult Archive",
  "Historical documents about mysterious groups.");

  add("ex","ExMembers",
  "Stories from former members.");

  add("cnews","CultNews",
  "News and investigations.");

  add("research","Religion Research",
  "Comparative research database.");

 }

 if(/lantern/.test(x))
  add("lantern","Lantern Society",
  "A group active in the late 1970s.");

 if(/hollow/.test(x))
  add("hollow","Hollow Creek",
  "A mysterious rural community.");

 if(/veyra/.test(x))
  add("veyra","Veyra Circle",
  "A philosophical movement from the 1980s.");

 if(/star/.test(x))
  add("stars","Children of the Star",
  "A strange organization from the 1970s.");

 if(/eye|open eye/.test(x)){

  add("garden","GardenTalk",
  "An old gardening forum contains references to an Eye.");

  add("mirror","Mirror House",
  "A strange personal homepage.");

  add("eye","The Open Eye",
  "A private online spiritual community.");

 }

 if(/blackbox|black box/.test(x))
  add("blackbox","BlackBox Archive",
  "Access to an old digital archive.");

 if(/room 7|room7/.test(x))
  add("numberseven","Room 7",
  "A page containing almost nothing.");

 if(/watcher/.test(x))
  add("watcher","The Watcher",
  "A personal page updated once every year.");

 if(/door/.test(x))
  add("door","The Door",
  "A strange page with one link.");

 if(!r.length){

  r.push(`
  <div class="box">
   <h3>No results.</h3>
   <p>Try another search.</p>
  </div>`);

 }

 layout("Search Results",
 `<p>Results for <b>${esc(q)}</b></p>${r.join("")}`);

}
