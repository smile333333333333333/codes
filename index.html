/* =========================
   UTILITIES
========================= */

function L(id,text){
return `<a onclick="go('${id}')">${text||sites[id]?.[0]||id}</a>`;
}

function esc(x){
return String(x).replace(/[&<>"]/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;"
}[m]));
}

function layout(title,body,cls=""){
page.innerHTML=
`<div class="head ${cls}">
<h1>${title}</h1>
<small>WebWorld Internet Service • 2004</small>
</div>
<div class="body">${body}</div>`;
}

function go(id,push=true){

if(!sites[id]){
notfound();
return;
}

if(push){
hist.splice(pos+1);
hist.push(id);
pos++;
}

if(!player.visited.includes(id))
player.visited.push(id);

document.getElementById("url").textContent=
"http://"+sites[id][1]+"/";

if(routes[id])routes[id]();
else personal(id);

save();
}

function back(){
if(pos>0){
pos--;
go(hist[pos],false);
}
}

function forward(){
if(pos<hist.length-1){
pos++;
go(hist[pos],false);
}
}

function startGame(){
document.getElementById("start").style.display="none";
go("home");
}

function modal(title,content){
mt.textContent=title;
mc.innerHTML=content;
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function search(){

let q=document.getElementById("q").value.trim();

if(!q)return;

let x=q.toLowerCase();
let r=[];

const add=(id,title,text)=>{
r.push(`
<div class=box>
<h3>${L(id,title)}</h3>
<p>${text}</p>
</div>`);
};

/* NORMAL SEARCH */

if(/cat|pet/.test(x))
add("pets","Pet Palace","Pictures of pets.");

if(/fish/.test(x))
add("ben","Ben's Fishing Page","A personal fishing homepage.");

if(/space|star|moon|astronomy/.test(x))
add("nate","Nate's Astronomy Page","Stars, planets and astronomy.");

if(/horse/.test(x))
add("sara","Sara's Horse World","Horse pictures and information.");

if(/poem|poetry/.test(x))
add("beth","Beth's Poetry Corner","Personal poems.");

if(/computer|pc/.test(x))
add("mike","Mike's Computer Page","Computer repairs and hardware.");

if(/garden|flower|plant/.test(x))
add("garden","GardenTalk","A gardening forum.");

if(/movie|film/.test(x))
add("dan","Dan's Movie Page","Reviews of old movies.");

if(/book|reading/.test(x))
add("emily","Emily's Book Nook","Books and reviews.");

/* CULT SEARCH */

if(/cult|sect|group|religion|ritual/.test(x)){

add("cult","CultWatch",
"Independent research into unusual organizations.");

add("archive","The Cult Archive",
"Historical documents about mysterious groups.");

add("ex","ExMembers",
"Stories from former members.");

add("cnews","CultNews",
"News and investigations.");

add("research","Religion Research",
"Comparative research database.");

}

/* SPECIFIC GROUPS */

if(/lantern/.test(x))
add("lantern","Lantern Society",
"A group active in the late 1970s.");

if(/hollow/.test(x))
add("hollow","Hollow Creek",
"A mysterious rural community.");

if(/veyra/.test(x))
add("veyra","Veyra Circle",
"A philosophical movement from the 1980s.");

if(/star/.test(x))
add("stars","Children of the Star",
"A strange organization from the 1970s.");

if(/eye|open eye|elysium/.test(x)){

add("garden","GardenTalk",
"An old gardening forum contains references to an Eye.");

add("mirror","Mirror House",
"A strange personal homepage.");

add("eye","The Open Eye",
"A private online spiritual community.");

}

/* DEEP TERMS */

if(/blackbox|black box/.test(x))
add("blackbox","BlackBox Archive",
"Access to an old digital archive.");

if(/room 7|room7/.test(x))
add("numberseven","Room 7",
"A page containing almost nothing.");

if(/watcher/.test(x))
add("watcher","The Watcher",
"A personal page updated once every year.");

if(/door/.test(x))
add("door","The Door",
"A strange page with one link.");

if(!r.length){

r.push(`
<div class=box>
<h3>No results.</h3>
<p>Try another search.</p>
</div>`);

}

layout("Search Results",
`<p>Results for <b>${esc(q)}</b></p>${r.join("")}`);

}
